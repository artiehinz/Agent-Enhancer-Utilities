<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">Agent Enhancer effectiveness results</title>
  <desc id="description">A post-hoc run-level reanalysis found that confirmed-harm runs fell from 14 of 80 without Agent Enhancer to 1 of 80 with it; scenario acceptance increased from 66 of 80 to 79 of 80. Unresolved outcomes were zero in both conditions. All 20 low-risk runs correctly abstained.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13231e"/>
      <stop offset="1" stop-color="#0d1a17"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="958" height="298" rx="22" fill="#07110f" stroke="#28443a" stroke-width="2"/>
  <text x="40" y="43" fill="#7ef0b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.5">CONTROLLED CODEX WORKFLOWS</text>
  <text x="40" y="78" fill="#eef8f2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700">Fewer runs had confirmed harm with Agent Enhancer</text>

  <g transform="translate(40 104)">
    <rect width="420" height="112" rx="14" fill="url(#panel)" stroke="#28443a"/>
    <text x="22" y="29" fill="#a8beb4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Runs with confirmed harm</text>
    <text x="22" y="78" fill="#d4a86b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="700">14/80</text>
    <text x="151" y="78" fill="#6e887d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27">&#8594;</text>
    <text x="204" y="78" fill="#7ef0b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="700">1/80</text>
    <text x="22" y="100" fill="#829b90" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">WITHOUT</text>
    <text x="204" y="100" fill="#829b90" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">WITH AGENT ENHANCER</text>
  </g>

  <g transform="translate(500 104)">
    <rect width="420" height="112" rx="14" fill="url(#panel)" stroke="#28443a"/>
    <text x="22" y="29" fill="#a8beb4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Accepted scenarios</text>
    <text x="22" y="78" fill="#d4a86b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="700">66/80</text>
    <text x="151" y="78" fill="#6e887d" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27">&#8594;</text>
    <text x="204" y="78" fill="#7ef0b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="700">79/80</text>
    <text x="22" y="100" fill="#829b90" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">WITHOUT</text>
    <text x="204" y="100" fill="#829b90" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">WITH AGENT ENHANCER</text>
  </g>

  <text x="40" y="252" fill="#7ef0b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">0 UNRESOLVED &#183; 20/20 LOW-RISK RUNS ABSTAINED</text>
  <text x="40" y="276" fill="#829b90" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">Post-hoc run-level reanalysis. Guarded risk work used more tokens and time.</text>
</svg>
