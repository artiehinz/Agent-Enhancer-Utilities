name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a3c8640a397cf97299fbe43c5caa0723c2a844e1
        with:
          python-version: "3.13"
      - run: python scripts/validate.py
