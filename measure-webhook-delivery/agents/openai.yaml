interface:
  display_name: "Measure Webhook Delivery"
  short_description: "Measure bounded webhook retry attempts"
  default_prompt: "Use $measure-webhook-delivery to create a safe webhook meter and analyze the observed attempts."

dependencies:
  tools:
    - type: "mcp"
      value: "agent-utility-lab"
      description: "Public bounded webhook testing utilities"
      transport: "streamable_http"
      url: "https://liberated.site/mcp"

policy:
  allow_implicit_invocation: true
